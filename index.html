<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Inventário</title>

    <link rel="stylesheet" href="styleHome.css">

</head>
<body class="body">
    <main id="mainGet">
        <div class="card">
            <div class="title">
                <h1>Importe relatório de Contagem</h1>
            </div>
            <div class="imports">
                <label>.XLSX</label>
                <input id="input-btn" type="file" value="none" accept=".xlsx">
            </div>
            <div class="buttonRelatorio">
                <button id="gerar">Gerar Relatório</button>    
            </div>
        </div>
    </main>
    <script src="getJson.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script defer>
        const removeElement = (element) =>{
            element.remove()
        }

        const inputBTN = document.getElementById("input-btn")
        let json
        inputBTN.addEventListener("change", (event) => {
            const archive = event.target.files[0]

            if(!archive) return

            const reader = new FileReader()
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result)
                const workbook = XLSX.read(data, {type: "array"})
                const sheet = workbook.Sheets[workbook.SheetNames[0]]
                json = XLSX.utils.sheet_to_json(sheet, { defval: ""})
                // console.log(json)
            }
            reader.readAsArrayBuffer(archive)
        })

        const gerarTabela = document.getElementById("gerar")
        const mainGetDT = document.getElementById("mainGet")
        gerarTabela.addEventListener('click', () =>{
            if(json){
                removeElement(mainGetDT)
                classBody()
                changeData(json)
            }else{
                alert("Importe o arquivo .xlsx")
            }
        })
    </script>
    <script src="effects.js" defer></script>
</body>
</html>
